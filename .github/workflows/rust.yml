name: Rust CI & Release

on:
  push:
    branches: [master, main]
    tags: ['v*'] # Triggers release logic on tags
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # 1. Fast Check: Lint and Test (Runs on every push/PR)
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwayland-dev libx11-dev libxkbcommon-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2 # The secret to speed
      - name: Format Check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Run Tests
        run: cargo test

  # 2. Build Matrix: Compiles for all platforms in parallel
  build:
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux_x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows_x64
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwayland-dev libx11-dev libxkbcommon-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
      
      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifacts
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          EXE_NAME="commonkey_extractor"
          if [ "${{ runner.os }}" == "Windows" ]; then
            mv ${EXE_NAME}.exe ${EXE_NAME}_${{ matrix.suffix }}.exe
            echo "ASSET=${EXE_NAME}_${{ matrix.suffix }}.exe" >> $GITHUB_ENV
          else
            mv ${EXE_NAME} ${EXE_NAME}_${{ matrix.suffix }}
            echo "ASSET=${EXE_NAME}_${{ matrix.suffix }}" >> $GITHUB_ENV
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: target/${{ matrix.target }}/release/${{ env.ASSET }}
